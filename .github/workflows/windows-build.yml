name: Ghost FTP Windows Build

on:
  push:
    branches:
      - main
      - 'work/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: host-ftp-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Host-FTP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap maintained Ghost FTP source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path go.mod) {
            Write-Host 'SOURCE_BOOTSTRAP=SKIP'
            exit 0
          }

          $source = Join-Path $env:RUNNER_TEMP 'ghostftp-source'
          Remove-Item -LiteralPath $source -Recurse -Force -ErrorAction SilentlyContinue
          git clone --depth 1 --branch work/reference-ui-1to1 https://github.com/bren-wp/Ghost-FTP.git $source
          if ($LASTEXITCODE -ne 0) { throw 'Unable to clone Ghost FTP source baseline.' }

          foreach ($name in @('cmd','internal','scripts','build')) {
            Copy-Item -LiteralPath (Join-Path $source $name) -Destination (Join-Path $env:GITHUB_WORKSPACE $name) -Recurse -Force
          }
          foreach ($name in @('go.mod','.editorconfig','.gitattributes','.gitignore')) {
            Copy-Item -LiteralPath (Join-Path $source $name) -Destination (Join-Path $env:GITHUB_WORKSPACE $name) -Force
          }

          Write-Host 'SOURCE_BOOTSTRAP=PASS'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid VERSION value: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "GHOST_FTP_VERSION=$version"

      - name: Format, vet and test Windows source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go telemetry off
          gofmt -w .\cmd .\internal
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed.' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed.' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows test suite failed.' }

      - name: Generate canonical Ghost FTP brand assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go telemetry off
          python .\scripts\generate_brand_assets.py --materialize
          if ($LASTEXITCODE -ne 0) { throw 'Brand asset generation failed.' }

      - name: Build Setup, Portable and Update executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path cmd\installer\payload | Out-Null

          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:GOAMD64 = 'v1'
          $env:GOTOOLCHAIN = 'local'

          $portable = "dist\Ghost-FTP-$version-Portable.exe"
          $setup = "dist\Ghost-FTP-$version-Setup.exe"
          $updater = "dist\Ghost-FTP-$version-Update.exe"
          $payload = 'cmd\installer\payload\payload.zip'
          $appLdflags = "-s -w -H=windowsgui -X main.version=$version"

          go build -trimpath -buildvcs=false -ldflags $appLdflags -o $portable .\cmd\ghostftp
          if ($LASTEXITCODE -ne 0) { throw 'Portable.exe build failed.' }
          python .\scripts\pe_resources.py $portable --ico .\build\icon.ico --brand-ico .\build\brandmark.ico --version $version --role portable --original-filename "Ghost-FTP-$version-Portable.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Portable PE resource step failed.' }

          python .\scripts\make_payload.py --app $portable --output $payload
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload generation failed.' }

          try {
            go build -trimpath -buildvcs=false -ldflags $appLdflags -o $setup .\cmd\installer
            if ($LASTEXITCODE -ne 0) { throw 'Setup.exe build failed.' }
          }
          finally {
            Remove-Item -LiteralPath $payload -Force -ErrorAction SilentlyContinue
          }
          python .\scripts\pe_resources.py $setup --ico .\build\icon.ico --brand-ico .\build\brandmark.ico --version $version --role setup --original-filename "Ghost-FTP-$version-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Setup PE resource step failed.' }

          go build -trimpath -buildvcs=false -ldflags $appLdflags -o $updater .\cmd\updater
          if ($LASTEXITCODE -ne 0) { throw 'Update.exe build failed.' }
          python .\scripts\pe_resources.py $updater --ico .\build\icon.ico --brand-ico .\build\brandmark.ico --version $version --role updater --original-filename "Ghost-FTP-$version-Update.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Updater PE resource step failed.' }

          foreach ($path in @($portable,$setup,$updater)) {
            if (-not (Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -lt 100000) {
              throw "Invalid Windows artifact: $path"
            }
          }

          Get-FileHash $portable,$setup,$updater -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -LiteralPath dist\SHA256.txt -Encoding ascii

      - name: Capture authentic reference UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          .\scripts\capture_reference_windows.ps1 -Executable "dist\Ghost-FTP-$version-Portable.exe" -OutputDirectory ui-screenshots

      - name: Package exact source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          $stage = Join-Path $env:RUNNER_TEMP "Ghost-FTP-$version-Source"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          foreach ($name in @('cmd','internal','scripts','build','.github')) {
            if (Test-Path $name) {
              Copy-Item -LiteralPath $name -Destination (Join-Path $stage $name) -Recurse -Force
            }
          }
          foreach ($name in @(
            'go.mod','VERSION','README.md','RELEASE_NOTES.md','UPDATE_SERVICE.md',
            'LICENSE','THIRD_PARTY_NOTICES.md','.gitignore','.editorconfig','.gitattributes'
          )) {
            if (Test-Path $name) {
              Copy-Item -LiteralPath $name -Destination (Join-Path $stage $name) -Force
            }
          }

          $zip = "dist\Ghost-FTP-$version-Source.zip"
          Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip -PathType Leaf) -or (Get-Item $zip).Length -lt 50000) {
            throw 'Source ZIP is missing or unexpectedly small.'
          }

          $hash = Get-FileHash $zip -Algorithm SHA256
          Add-Content -LiteralPath dist\SHA256.txt -Value "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($zip))" -Encoding ascii

      - name: Generate update.ghostftp.com manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()

          function Digest([string]$path) {
            return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          $setupName = "Ghost-FTP-$version-Setup.exe"
          $portableName = "Ghost-FTP-$version-Portable.exe"
          $updaterName = "Ghost-FTP-$version-Update.exe"

          $manifest = [ordered]@{
            schema = 1
            version = $version
            setup_url = "https://update.ghostftp.com/windows/$setupName"
            setup_sha256 = Digest "dist\$setupName"
            portable_url = "https://update.ghostftp.com/windows/$portableName"
            portable_sha256 = Digest "dist\$portableName"
            updater_url = "https://update.ghostftp.com/windows/$updaterName"
            updater_sha256 = Digest "dist\$updaterName"
          }

          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath dist\latest.json -Encoding utf8
          $manifestHash = Get-FileHash -LiteralPath dist\latest.json -Algorithm SHA256
          Add-Content -LiteralPath dist\SHA256.txt -Value "$($manifestHash.Hash.ToLowerInvariant())  latest.json" -Encoding ascii

      - name: Persist generated source assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace((git status --porcelain))) {
            Write-Host 'SOURCE_COMMIT=UNCHANGED'
            exit 0
          }

          $version = (Get-Content VERSION -Raw).Trim()
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add -A
          git commit -m "Refresh Ghost FTP $version generated release assets"
          git push origin HEAD:${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { throw 'Unable to push generated Host-FTP source assets.' }
          Write-Host 'SOURCE_COMMIT=PUSHED'

      - name: Upload Windows deliverables
        uses: actions/upload-artifact@v4
        with:
          name: ghostftp-windows-${{ steps.version.outputs.value }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/Ghost-FTP-*-Setup.exe
            dist/Ghost-FTP-*-Portable.exe
            dist/Ghost-FTP-*-Update.exe
            dist/Ghost-FTP-*-Source.zip
            dist/SHA256.txt
            dist/latest.json
            ui-screenshots/*.png

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $target = (git rev-parse HEAD).Trim()
          $assets = @(
            "dist\Ghost-FTP-$version-Setup.exe",
            "dist\Ghost-FTP-$version-Portable.exe",
            "dist\Ghost-FTP-$version-Update.exe",
            "dist\Ghost-FTP-$version-Source.zip",
            "dist\SHA256.txt",
            "dist\latest.json"
          )

          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo ${{ github.repository }} --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Unable to refresh GitHub release assets.' }
            gh release edit $tag --repo ${{ github.repository }} --title "Ghost FTP $version" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Unable to refresh GitHub release notes.' }
          }
          else {
            gh release create $tag @assets --repo ${{ github.repository }} --target $target --title "Ghost FTP $version" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Unable to publish GitHub release.' }
          }
